[package]
name = "powerfs-master"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://www.powerfs.org"
repository = "https://github.com/fudanPPI/powerfs"
description = "PowerFS Master server - cluster coordination, volume assignment, Raft leader"

[package.metadata.deb]
maintainer = "PowerFS Team <jiangjinhu@fudan.edu.cn>"
section = "net"
priority = "optional"
depends = "powerfs-cli (= 0.1.0)"
conf-files = ["/etc/powerfs/powerfs.env"]
assets = [
    ["target/release/powerfs-master", "usr/bin/", "755"],
    ["../powerfs-packaging/systemd/powerfs-master.service", "lib/systemd/system/", "644"],
    ["../powerfs-packaging/scripts/postinst", "DEBIAN/postinst", "755"],
    ["../powerfs-packaging/scripts/prerm", "DEBIAN/prerm", "755"],
    ["../powerfs-packaging/scripts/postrm", "DEBIAN/postrm", "755"],
]

[features]
default = ["kv", "redis-event"]
kv = []
redis-event = ["powerfs-common/redis-event"]

[build-dependencies]
tonic-build = { version = "0.11" }

[dev-dependencies]
tempfile = "3.8"
rfs_tester = { path = "../rfs_tester" }

[[bin]]
name = "powerfs-master"
path = "src/main.rs"

[dependencies]
powerfs-common = { path = "../powerfs-common" }
powerfs-core = { path = "../powerfs-core" }
powerfs-net = { path = "../powerfs-net" }
powerfs-orset = { path = "../powerfs-orset" }
tokio = { workspace = true }
crossbeam = { workspace = true }
raft = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rocksdb = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
protobuf = "2"
slog = "2"
prometheus = "0.13"
hyper = { version = "1", features = ["full"] }
lazy_static = "1.4"
axum = "0.6"
dashmap = { workspace = true }
redis = { version = "0.22", features = ["tokio-comp"], optional = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tower = "0.4"
sysinfo = "0.30"
tikv-jemallocator = "0.5"
clap = { workspace = true }
env_logger = { workspace = true }
