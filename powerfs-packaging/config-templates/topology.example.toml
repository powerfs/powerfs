# PowerFS 集群拓扑配置文件
#
# 用法: powerfs-cli config gen --topology topology.toml
#
# 合并优先级: CLI 参数 > 拓扑文件值 > 内置默认值
#
# 校验规则 (不通过则退出):
#   - masters >= 3 (Raft 生产环境要求)
#   - volumes >= 1, filers >= 1
#   - 每个角色内 IP 不能重复
#   - 跨角色 IP 不能重复 (除非 --allow-collocated)
#   - 所有 IP 必须是合法 IPv4 格式
#   - 端口范围 1-65535, 同节点类型端口不能冲突
#   - masters 推荐奇数 (偶数时仅警告不退出)

# ============================================================================
# 必填: 集群节点拓扑
# ============================================================================

[masters]
# Master 节点 IP 列表, 至少 3 个 (Raft 要求奇数: 3, 5, 7)
hosts = ["10.0.0.11", "10.0.0.12", "10.0.0.13"]

[volumes]
# Volume 节点 IP 列表, 至少 1 个
hosts = ["10.0.0.21", "10.0.0.22"]

[filers]
# Filer 节点 IP 列表, 至少 1 个 (推荐 3 个组成 Raft 集群)
hosts = ["10.0.0.31", "10.0.0.32", "10.0.0.33"]

[redis]
# Redis 服务器 IP
host = "10.0.0.11"

# ============================================================================
# 可选: 端口覆盖 (省略时使用内置默认值)
# ============================================================================

[ports]
# master = 9333           # Master gRPC/HTTP 端口
# master_net = 9334       # Master TLV 协议端口 (必须与 master 不同)
# volume_grpc = 8080      # Volume gRPC 端口
# volume_http = 8091      # Volume HTTP 管理端口 (必须与 volume_net 不同)
# volume_net = 8901       # Volume TLV 协议端口
# filer = 8888            # Filer HTTP 端口
# filer_grpc = 8889       # Filer gRPC 端口
# filer_net = 9334        # Filer TLV 协议端口 (必须与 filer 不同)
# s3 = 9000               # S3 网关端口
# monitor = 8081          # Monitor 服务端口

# ============================================================================
# 可选: 存储参数覆盖
# ============================================================================

[storage]
# data_dir = "/data"                    # 数据目录前缀
# max_volume_size = 107374182400        # 单个 volume 最大容量 (100GB)
# initial_volume_count = 4              # 每 volume server 预创建卷数
# shard_count = 2                       # Filer 分片数

# ============================================================================
# 可选: FUSE 客户端参数覆盖
# ============================================================================

[fuse]
# mount_point = "/mnt/powerfs"          # 挂载点
# threads = 8                           # FUSE 工作线程数

# ============================================================================
# 可选: S3 网关凭据覆盖
# ============================================================================

[s3]
# access_key = "powerfs"
# secret_key = "powerfs123"

# ============================================================================
# 可选: 杂项参数覆盖
# ============================================================================

[misc]
# collection = "default"                # 集合名
# replication = "000"                   # 副本放置策略 (000=无副本)
# output = "./configs"                  # 输出目录
