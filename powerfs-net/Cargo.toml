[package]
name = "powerfs-net"
version = "0.1.0"
edition = "2021"
description = "PowerFS lightweight binary network protocol for metadata and data operations"

[features]
# RDMA is a default feature: PowerFS is a distributed filesystem whose core
# value proposition includes hardware RDMA transport. Defaulting RDMA on means
# every build (CI, dev, release) exercises the RDMA code path so immature
# modes are used and bugs surface, rather than being hidden behind --features.
# Requires libibverbs-dev + librdmacm-dev on the host. If missing, install:
#   sudo apt-get install -y libibverbs-dev librdmacm-dev
default = ["tcp", "rdma"]
tcp = []
# RDMA feature: enables transport_rdma module. The RDMA implementation uses
# direct FFI bindings to libibverbs + librdmacm (via the `libc` crate), so no
# external Rust RDMA crate is required. This keeps all IB code isolated in
# transport_rdma.rs and avoids dependency conflicts (e.g. jemalloc).
rdma = ["dep:libc"]

[dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
bytes = "1"
log = "0.4"
parking_lot = "0.12"
dashmap = { workspace = true }
crc32c = "0.6"
thiserror = "1"
async-trait = "0.1"
env_logger = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libc is an optional dep used only by the RDMA module to provide FFI
# bindings to libibverbs / librdmacm. Keeping it optional avoids pulling
# in libc for TCP-only builds.
libc = { workspace = true, optional = true }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
