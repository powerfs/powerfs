[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powerfs-kv"
version = "0.2.0"
description = "PowerFS KV Python SDK (gRPC): byte KV, PyTorch tensors, PagedAttention blocks"
requires-python = ">=3.8"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.22.0",
]

[project.optional-dependencies]
# PyTorch tensor interface; numpy comes in with the torch wheel.
torch = [
    "torch>=2.0",
]
dev = [
    "grpcio-tools>=1.60.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
powerfs = ["proto/*.py"]
