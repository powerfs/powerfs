[package]
name = "powerfs-filer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://www.powerfs.org"
repository = "https://github.com/fudanPPI/powerfs"
description = "PowerFS Filer - POSIX metadata service with Raft strong consistency"

[package.metadata.deb]
maintainer = "PowerFS Team <jiangjinhu@fudan.edu.cn>"
section = "net"
priority = "optional"
depends = "powerfs-cli (= 0.1.0)"
conf-files = ["/etc/powerfs/powerfs.env"]
assets = [
    ["target/release/powerfs-filer", "usr/bin/", "755"],
    ["../powerfs-packaging/systemd/powerfs-filer.service", "lib/systemd/system/", "644"],
    ["../powerfs-packaging/scripts/postinst", "DEBIAN/postinst", "755"],
    ["../powerfs-packaging/scripts/prerm", "DEBIAN/prerm", "755"],
    ["../powerfs-packaging/scripts/postrm", "DEBIAN/postrm", "755"],
]

[features]
default = ["redis-event"]
redis-event = ["dep:redis", "powerfs-common/redis-event"]

[[bin]]
name = "powerfs-filer"
path = "src/main.rs"

[dependencies]
axum = "0.6"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
rand = "0.8"
redis = { version = "0.23", features = ["tokio-comp"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
powerfs-common = { path = "../powerfs-common" }
powerfs-master = { path = "../powerfs-master" }
powerfs-net = { path = "../powerfs-net" }
powerfs-coherence = { path = "../powerfs-coherence" }
hex = "0.4"
sha2 = "0.10"
raft = { workspace = true }
protobuf = "2"
rocksdb = { workspace = true }
slog = "2.7"
bytes = "1.0"
tonic = { workspace = true }
prost = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
sysinfo = "0.30"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"