[package]
name = "powerfs-ctl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PowerFS deployment and lifecycle control plane"

[[bin]]
name = "powerfs-ctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
minijinja = { version = "2.0", default-features = false, features = ["loader", "serde", "builtins"] }
which = "7"
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["json"] }
# cert demo-bundle: offline CA/leaf minting for the single-container demo image.
rcgen = { version = "0.13", features = ["pem"] }
sha2 = "0.10"
time = "0.3"
powerfs-common = { path = "../powerfs-common" }

[dev-dependencies]
# test-util enables `#[tokio::test(start_paused = true)]` so health-gate
# sleeps in bootstrap tests complete instantly in virtual time.
tokio = { workspace = true, features = ["test-util"] }
