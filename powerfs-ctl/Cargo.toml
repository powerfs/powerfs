[package]
name = "powerfs-ctl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PowerFS deployment and lifecycle control plane"

[[bin]]
name = "powerfs-ctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
minijinja = { version = "2.0", default-features = false, features = ["loader", "serde", "builtins"] }
which = "7"
thiserror = { workspace = true }
tokio = { workspace = true }
powerfs-common = { path = "../powerfs-common" }
