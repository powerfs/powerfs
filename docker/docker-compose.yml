networks:
  powerfs-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

# 全局日志轮转: 避免长期运行容器日志无限增长.
# 每个容器最多 3 个日志文件, 每个最大 100MB (合计上限 300MB/容器).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

volumes:
  master-1-data:
  master-2-data:
  master-3-data:
  volume-1-data:
  volume-2-data:
  volume-3-data:
  volume-4-data:
  volume-5-data:
  volume-6-data:
  redis-data:
  s3-data:
  filer-1-data:
  filer-2-data:
  filer-3-data:

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    logging: *default-logging
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.50
    volumes:
      - redis-data:/data
    ports:
      - "16379:6379"
    command: redis-server --bind 0.0.0.0 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  master-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: master-1
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.11
    volumes:
      - master-1-data:/data
      - ./config/master-1.toml:/app/config/master.toml:ro
      - /home/portion/powerfs/target/release/powerfs-master:/app/powerfs-master:ro
    ports:
      - "9333:9333"
    environment:
      - REDIS_URL=redis://redis:6379
      - POWERFS_EC_DATA_SHARDS=${POWERFS_EC_DATA_SHARDS:-4}
      - POWERFS_EC_PARITY_SHARDS=${POWERFS_EC_PARITY_SHARDS:-2}
    command: >
      /app/powerfs-master
      --config /app/config/master.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.0.11 9333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  master-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: master-2
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.12
    volumes:
      - master-2-data:/data
      - ./config/master-2.toml:/app/config/master.toml:ro
      - /home/portion/powerfs/target/release/powerfs-master:/app/powerfs-master:ro
    ports:
      - "9336:9333"
    environment:
      - REDIS_URL=redis://redis:6379
      - POWERFS_EC_DATA_SHARDS=${POWERFS_EC_DATA_SHARDS:-4}
      - POWERFS_EC_PARITY_SHARDS=${POWERFS_EC_PARITY_SHARDS:-2}
    command: >
      /app/powerfs-master
      --config /app/config/master.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.0.12 9333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  master-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: master-3
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.13
    volumes:
      - master-3-data:/data
      - ./config/master-3.toml:/app/config/master.toml:ro
      - /home/portion/powerfs/target/release/powerfs-master:/app/powerfs-master:ro
    ports:
      - "9337:9333"
    environment:
      - REDIS_URL=redis://redis:6379
      - POWERFS_EC_DATA_SHARDS=${POWERFS_EC_DATA_SHARDS:-4}
      - POWERFS_EC_PARITY_SHARDS=${POWERFS_EC_PARITY_SHARDS:-2}
    command: >
      /app/powerfs-master
      --config /app/config/master.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.0.13 9333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  volume-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: volume-1
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.21
    volumes:
      - volume-1-data:/data
      - ./config/volume-1.toml:/app/config/volume.toml:ro
      - /home/portion/powerfs/target/release/powerfs-volume:/app/powerfs-volume:ro
      - ./certs:/etc/powerfs/certs:ro
    ports:
      - "8080:8080"    # gRPC端口
      - "8091:8091"    # HTTP管理端口
      - "8901:8901"    # powerfs-net端口 (与HTTP端口不同!)
    environment:
      - REDIS_URL=redis://redis:6379
    command: >
      /app/powerfs-volume
      --config /app/config/volume.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.0.21 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  volume-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: volume-2
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.22
    volumes:
      - volume-2-data:/data
      - ./config/volume-2.toml:/app/config/volume.toml:ro
      - /home/portion/powerfs/target/release/powerfs-volume:/app/powerfs-volume:ro
      - ./certs:/etc/powerfs/certs:ro
    ports:
      - "8081:8080"    # gRPC端口
      - "8092:8092"    # HTTP管理端口
      - "8902:8901"    # powerfs-net端口 (容器内统一8901)
    environment:
      - REDIS_URL=redis://redis:6379
    command: >
      /app/powerfs-volume
      --config /app/config/volume.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.0.22 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  volume-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: volume-3
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.23
    volumes:
      - volume-3-data:/data
      - ./config/volume-3.toml:/app/config/volume.toml:ro
      - /home/portion/powerfs/target/release/powerfs-volume:/app/powerfs-volume:ro
      - ./certs:/etc/powerfs/certs:ro
    ports:
      - "8082:8080"    # gRPC端口
      - "8093:8093"    # HTTP管理端口
      - "8903:8901"    # powerfs-net端口 (容器内统一8901)
    environment:
      - REDIS_URL=redis://redis:6379
    command: >
      /app/powerfs-volume
      --config /app/config/volume.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.0.23 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  # P6: EC 测试扩容 volume (EC(4+2) 需要 >=6 个 volume 节点)
  volume-4:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: volume-4
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.24
    volumes:
      - volume-4-data:/data
      - ./config/volume-4.toml:/app/config/volume.toml:ro
      - /home/portion/powerfs/target/release/powerfs-volume:/app/powerfs-volume:ro
      - ./certs:/etc/powerfs/certs:ro
    ports:
      - "8085:8080"    # gRPC端口
      - "8094:8094"    # HTTP管理端口
      - "8904:8901"    # powerfs-net端口 (容器内统一8901)
    environment:
      - REDIS_URL=redis://redis:6379
    command: >
      /app/powerfs-volume
      --config /app/config/volume.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.0.24 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  volume-5:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: volume-5
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.25
    volumes:
      - volume-5-data:/data
      - ./config/volume-5.toml:/app/config/volume.toml:ro
      - /home/portion/powerfs/target/release/powerfs-volume:/app/powerfs-volume:ro
      - ./certs:/etc/powerfs/certs:ro
    ports:
      - "8086:8080"    # gRPC端口
      - "8095:8095"    # HTTP管理端口
      - "8905:8901"    # powerfs-net端口 (容器内统一8901)
    environment:
      - REDIS_URL=redis://redis:6379
    command: >
      /app/powerfs-volume
      --config /app/config/volume.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.0.25 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  volume-6:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: volume-6
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.26
    volumes:
      - volume-6-data:/data
      - ./config/volume-6.toml:/app/config/volume.toml:ro
      - /home/portion/powerfs/target/release/powerfs-volume:/app/powerfs-volume:ro
      - ./certs:/etc/powerfs/certs:ro
    ports:
      - "8087:8080"    # gRPC端口
      - "8096:8096"    # HTTP管理端口
      - "8906:8901"    # powerfs-net端口 (容器内统一8901)
    environment:
      - REDIS_URL=redis://redis:6379
    command: >
      /app/powerfs-volume
      --config /app/config/volume.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.30.0.26 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  filer-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: filer-1
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.31
    volumes:
      - filer-1-data:/data/filer
      - ./config/filer-1.toml:/app/config/filer.toml:ro
      - /home/portion/powerfs/target/release/powerfs-filer:/app/powerfs-filer:ro
      - ./certs:/etc/powerfs/certs:ro
    ports:
      - "8888:8888"    # HTTP端口
      - "8889:8889"    # gRPC端口
      - "9334:9334"    # powerfs-net端口
    command: >
      /app/powerfs-filer
      --config /app/config/filer.toml
    environment:
      - REDIS_URL=redis://redis:6379
      - POWERFS_SCRUBBER_SCAN_INTERVAL=${POWERFS_SCRUBBER_SCAN_INTERVAL:-30}
      - POWERFS_SCRUBBER_MAX_INODES=${POWERFS_SCRUBBER_MAX_INODES:-50}
      - POWERFS_EC_DATA_SHARDS=${POWERFS_EC_DATA_SHARDS:-4}
      - POWERFS_EC_PARITY_SHARDS=${POWERFS_EC_PARITY_SHARDS:-2}
      - POWERFS_EC_MIN_FILE_SIZE=${POWERFS_EC_MIN_FILE_SIZE:-1073741824}
    healthcheck:
      test: ["CMD-SHELL", "nc -z filer-1 8888 && nc -z filer-1 8889 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      master-1:
        condition: service_healthy

  filer-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: filer-2
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.32
    volumes:
      - filer-2-data:/data/filer
      - ./config/filer-2.toml:/app/config/filer.toml:ro
      - /home/portion/powerfs/target/release/powerfs-filer:/app/powerfs-filer:ro
      - ./certs:/etc/powerfs/certs:ro
    ports:
      - "8898:8888"    # HTTP端口
      - "8899:8889"    # gRPC端口
      - "9344:9334"    # powerfs-net端口
    command: >
      /app/powerfs-filer
      --config /app/config/filer.toml
    environment:
      - REDIS_URL=redis://redis:6379
      - POWERFS_SCRUBBER_SCAN_INTERVAL=${POWERFS_SCRUBBER_SCAN_INTERVAL:-30}
      - POWERFS_SCRUBBER_MAX_INODES=${POWERFS_SCRUBBER_MAX_INODES:-50}
      - POWERFS_EC_DATA_SHARDS=${POWERFS_EC_DATA_SHARDS:-4}
      - POWERFS_EC_PARITY_SHARDS=${POWERFS_EC_PARITY_SHARDS:-2}
      - POWERFS_EC_MIN_FILE_SIZE=${POWERFS_EC_MIN_FILE_SIZE:-1073741824}
    healthcheck:
      test: ["CMD-SHELL", "nc -z filer-2 8888 && nc -z filer-2 8889 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      master-1:
        condition: service_healthy

  filer-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: filer-3
    logging: *default-logging
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.33
    volumes:
      - filer-3-data:/data/filer
      - ./config/filer-3.toml:/app/config/filer.toml:ro
      - /home/portion/powerfs/target/release/powerfs-filer:/app/powerfs-filer:ro
      - ./certs:/etc/powerfs/certs:ro
    ports:
      - "8908:8888"    # HTTP端口
      - "8909:8889"    # gRPC端口
      - "9354:9334"    # powerfs-net端口
    command: >
      /app/powerfs-filer
      --config /app/config/filer.toml
    environment:
      - REDIS_URL=redis://redis:6379
      - POWERFS_SCRUBBER_SCAN_INTERVAL=${POWERFS_SCRUBBER_SCAN_INTERVAL:-30}
      - POWERFS_SCRUBBER_MAX_INODES=${POWERFS_SCRUBBER_MAX_INODES:-50}
      - POWERFS_EC_DATA_SHARDS=${POWERFS_EC_DATA_SHARDS:-4}
      - POWERFS_EC_PARITY_SHARDS=${POWERFS_EC_PARITY_SHARDS:-2}
      - POWERFS_EC_MIN_FILE_SIZE=${POWERFS_EC_MIN_FILE_SIZE:-1073741824}
    healthcheck:
      test: ["CMD-SHELL", "nc -z filer-3 8888 && nc -z filer-3 8889 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      master-1:
        condition: service_healthy

  s3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: s3
    logging: *default-logging
    networks:
      powerfs-network:
        # Was 172.30.0.32, but cce28ec5 assigned that to filer-2, colliding
        # with s3 and preventing both s3 and monitor (depends_on s3) from
        # starting. Moved to 172.30.0.40 (free in the current layout).
        ipv4_address: 172.30.0.40
    volumes:
      - s3-data:/data
      - ./config/s3.toml:/app/config/s3.toml:ro
      - /home/portion/powerfs/target/release/powerfs-s3:/app/powerfs-s3:ro
    ports:
      - "9000:9000"
    command: >
      /app/powerfs-s3
      --config /app/config/s3.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: monitor
    logging: *default-logging
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.30
    volumes:
      - ./config/monitor.toml:/app/config/monitor.toml:ro
      - /home/portion/powerfs/target/release/powerfs-monitor:/app/powerfs-monitor:ro
    ports:
      - "8083:8081"
    command: >
      /app/powerfs-monitor
      --config /app/config/monitor.toml
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy
      s3:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-frontend
    image: powerfs-frontend:latest
    container_name: frontend
    logging: *default-logging
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.43
    ports:
      - "8084:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      monitor:
        condition: service_healthy

  fuse-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: fuse-1
    logging: *default-logging
    hostname: fuse-1
    cpus: '1.0'
    mem_limit: 2g
    init: true
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.41
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    privileged: true
    restart: unless-stopped
    volumes:
      - /tmp/powerfs/fuse1:/mnt/powerfs
      - ./config/fuse-1.toml:/app/config/fuse.toml:ro
      - /home/portion/powerfs/target/release/powerfs-fuse:/app/powerfs-fuse:ro
      - ./certs:/etc/powerfs/certs:ro
    command: >
      /app/powerfs-fuse
      --config /app/config/fuse.toml
      --verbose
      --container
    depends_on:
      volume-1:
        condition: service_healthy
      volume-2:
        condition: service_healthy
      volume-3:
        condition: service_healthy

  fuse-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: fuse-2
    logging: *default-logging
    hostname: fuse-2
    cpus: '1.0'
    mem_limit: 2g
    init: true
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.42
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    privileged: true
    restart: unless-stopped
    volumes:
      - /tmp/powerfs/fuse2:/mnt/powerfs
      - ./config/fuse-2.toml:/app/config/fuse.toml:ro
      - /home/portion/powerfs/target/release/powerfs-fuse:/app/powerfs-fuse:ro
      - ./certs:/etc/powerfs/certs:ro
    command: >
      /app/powerfs-fuse
      --config /app/config/fuse.toml
      --verbose
      --container
    depends_on:
      volume-1:
        condition: service_healthy
      volume-2:
        condition: service_healthy
      volume-3:
        condition: service_healthy
