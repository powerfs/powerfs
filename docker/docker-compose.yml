networks:
  powerfs-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  master-1-data:
  master-2-data:
  master-3-data:
  volume-1-data:
  volume-2-data:
  volume-3-data:
  redis-data:
  s3-data:
  filer-1-data:
  filer-2-data:

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.50
    volumes:
      - redis-data:/data
    ports:
      - "16379:6379"
    command: redis-server --bind 0.0.0.0 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  master-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: master-1
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.11
    volumes:
      - master-1-data:/data
    ports:
      - "9333:9333"
    command: >
      /app/powerfs-master
      --port 9333
      --net-port 9334
      --dir /data/master
      --raft-id 1
      --advertise-addr 172.20.0.11:9333
      --peer 172.20.0.11:9333
      --peer 172.20.0.12:9333
      --peer 172.20.0.13:9333
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.20.0.11 9333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  master-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: master-2
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.12
    volumes:
      - master-2-data:/data
    ports:
      - "9334:9333"
    command: >
      /app/powerfs-master
      --port 9333
      --net-port 9334
      --dir /data/master
      --raft-id 2
      --advertise-addr 172.20.0.12:9333
      --peer 172.20.0.11:9333
      --peer 172.20.0.12:9333
      --peer 172.20.0.13:9333
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.20.0.12 9333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  master-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: master-3
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.13
    volumes:
      - master-3-data:/data
    ports:
      - "9335:9333"
    command: >
      /app/powerfs-master
      --port 9333
      --net-port 9334
      --dir /data/master
      --raft-id 3
      --advertise-addr 172.20.0.13:9333
      --peer 172.20.0.11:9333
      --peer 172.20.0.12:9333
      --peer 172.20.0.13:9333
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.20.0.13 9333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-2:
        condition: service_healthy

  volume-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: volume-1
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.21
    volumes:
      - volume-1-data:/data
    ports:
      - "8080:8080"
      - "8091:8091"
    command: >
      /app/powerfs-volume
      --grpc-address 0.0.0.0:8080
      --http-port 8091
      --net-port 8091
      --node-id volume-server-1
      --data-dir /data
      --master-address 172.20.0.11:9333
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.20.0.21 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  volume-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: volume-2
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.22
    volumes:
      - volume-2-data:/data
    ports:
      - "8081:8080"
      - "8092:8092"
    command: >
      /app/powerfs-volume
      --grpc-address 0.0.0.0:8080
      --http-port 8092
      --net-port 8092
      --node-id volume-server-2
      --data-dir /data
      --master-address 172.20.0.11:9333
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.20.0.22 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  volume-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: volume-3
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.23
    volumes:
      - volume-3-data:/data
    ports:
      - "8082:8080"
      - "8093:8093"
    command: >
      /app/powerfs-volume
      --grpc-address 0.0.0.0:8080
      --http-port 8093
      --net-port 8093
      --node-id volume-server-3
      --data-dir /data
      --master-address 172.20.0.11:9333
    healthcheck:
      test: ["CMD-SHELL", "nc -z 172.20.0.23 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  filer-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: filer-1
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.35
    ports:
      - "8888:8888"
      - "8889:8889"
      - "8890:8890"
      - "9344:9334"
    volumes:
      - filer-1-data:/data/filer
    command: >
      /app/powerfs-filer
      --port 8888
      --grpc-port 8889
      --net-port 9334
      --raft-id 1
      -D /data/filer
      --shard-count 2
      --master 172.20.0.11:9333
      --raft-peer 172.20.0.35:8889
      --raft-peer 172.20.0.36:8889
    environment:
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD-SHELL", "nc -z filer-1 8888 && nc -z filer-1 8889 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      master-1:
        condition: service_healthy

  filer-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: filer-2
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.36
    ports:
      - "8898:8888"
      - "8899:8889"
      - "8891:8890"
      - "9345:9334"
    volumes:
      - filer-2-data:/data/filer
    command: >
      /app/powerfs-filer
      --port 8888
      --grpc-port 8889
      --net-port 9334
      --raft-id 2
      -D /data/filer
      --shard-count 2
      --master 172.20.0.11:9333
      --raft-peer 172.20.0.35:8889
      --raft-peer 172.20.0.36:8889
    environment:
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD-SHELL", "nc -z filer-2 8888 && nc -z filer-2 8889 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      filer-1:
        condition: service_healthy

  s3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: s3
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.32
    volumes:
      - s3-data:/data
    ports:
      - "9000:9000"
    command: >
      /app/powerfs-s3
      --port 9000
      --dir /data/s3
      --master 172.20.0.11:9333
      --access-key powerfs
      --secret-key powerfs123
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy

  monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: monitor
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.30
    ports:
      - "8083:8081"
    command: >
      /app/powerfs-monitor
      --addr 0.0.0.0:8081
      --redis-url redis://redis:6379
      --s3-endpoint http://172.20.0.32:9000
      --s3-backend-endpoint http://172.20.0.32:9000
      --s3-access-key powerfs
      --s3-secret-key powerfs123
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      master-1:
        condition: service_healthy
      s3:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-frontend
    image: powerfs-frontend:latest
    container_name: frontend
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.31
    ports:
      - "8084:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      monitor:
        condition: service_healthy

  fuse-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: fuse-1
    cpus: '1.0'
    mem_limit: 512m
    init: true
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.41
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    privileged: true
    restart: unless-stopped
    volumes:
      - /tmp/powerfs/fuse1:/mnt/powerfs
    command: >
      /app/powerfs-fuse
      --mount-point /mnt/powerfs
      --master 172.20.0.11:9333
      --master-net-port 9334
      --volume-net-port 8091
      --filer-net-port 9334
      --filer-addr 172.20.0.35
      --collection default
      --replication 000
      --verbose
    depends_on:
      volume-1:
        condition: service_healthy
      volume-2:
        condition: service_healthy
      volume-3:
        condition: service_healthy

  fuse-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: powerfs:latest
    container_name: fuse-2
    cpus: '1.0'
    mem_limit: 512m
    init: true
    networks:
      powerfs-network:
        ipv4_address: 172.20.0.42
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    privileged: true
    restart: unless-stopped
    volumes:
      - /tmp/powerfs/fuse2:/mnt/powerfs
    command: >
      /app/powerfs-fuse
      --mount-point /mnt/powerfs
      --master 172.20.0.11:9333
      --master-net-port 9334
      --volume-net-port 8091
      --filer-net-port 9334
      --filer-addr 172.20.0.36
      --collection default
      --replication 000
      --verbose
    depends_on:
      volume-1:
        condition: service_healthy
      volume-2:
        condition: service_healthy
      volume-3:
        condition: service_healthy
