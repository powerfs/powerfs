# =============================================================================
# PowerFS 硬件 RDMA 传输测试 — 独立 compose 文件 (非覆盖)
# =============================================================================
# 用法:
#   # 1. 先停止 TCP 服务 (避免端口冲突)
#   docker compose -f docker-compose.yml down
#   # 2. 启动硬件 RDMA 服务 (host 网络模式)
#   docker compose -f docker-compose.rdma.yml up -d
#
# 架构:
#   - 所有服务使用 network_mode: host (共享宿主机 netns)
#   - Redis 复用 bridge 网络 (172.30.0.50), host 网络可直接访问
#   - 硬件 RDMA: mlx5_1 (ConnectX-5, IB 端口 ACTIVE, LID=1)
#   - IPoIB: ibp160s0f1, IP 192.168.100.1/24
#   - 单节点 master/volume/filer (功能验证, 非 HA)
#   - 服务地址: 192.168.100.1 (IPoIB)
#
# 前置条件:
#   1. GRUB: intel_iommu=on iommu=pt (已配置, 需重启生效)
#   2. sudo modprobe ib_umad ib_uverbs
#   3. sudo systemctl restart opensm
#   4. 验证: cat /sys/class/infiniband/mlx5_1/ports/1/state → ACTIVE
#   5. IPoIB: sudo ip addr add 192.168.100.1/24 dev ibp160s0f1
#   6. SR-IOV VF 已直通给 QEMU VM (vfio-pci)
# =============================================================================

# Redis 复用 bridge 网络 (单独定义, 不受 host 网络影响)
networks:
  powerfs-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: powerfs-br0
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

# 硬件 RDMA 设备映射 (mlx5_1 = uverbs1 + rdma_cm)
x-rdma-common: &rdma-common
  devices:
    - /dev/infiniband/uverbs1:/dev/infiniband/uverbs1
    - /dev/infiniband/rdma_cm:/dev/infiniband/rdma_cm
  cap_add:
    - IPC_LOCK
    - NET_ADMIN
  ulimits:
    memlock:
      soft: -1
      hard: -1

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      powerfs-network:
        ipv4_address: 172.30.0.50
    volumes:
      - redis-data:/data
    logging: *default-logging

  master-1:
    image: powerfs:latest
    container_name: master-1
    restart: unless-stopped
    network_mode: host
    <<: *rdma-common
    volumes:
      - master-rdma-data:/data/master
      - ./config/rdma-host/master.toml:/app/config/master.toml:ro
      - ../target/release/powerfs-master:/app/powerfs-master:ro
    command: ["/app/powerfs-master", "--config", "/app/config/master.toml"]
    depends_on:
      - redis
    logging: *default-logging

  volume-1:
    image: powerfs:latest
    container_name: volume-1
    restart: unless-stopped
    network_mode: host
    <<: *rdma-common
    volumes:
      - volume-rdma-data:/data
      - ./config/rdma-host/volume.toml:/app/config/volume.toml:ro
      - ../target/release/powerfs-volume:/app/powerfs-volume:ro
    command: ["/app/powerfs-volume", "--config", "/app/config/volume.toml"]
    depends_on:
      - redis
      - master-1
    logging: *default-logging

  filer-1:
    image: powerfs:latest
    container_name: filer-1
    restart: unless-stopped
    network_mode: host
    <<: *rdma-common
    volumes:
      - filer-rdma-data:/data/filer
      - ./config/rdma-host/filer.toml:/app/config/filer.toml:ro
      - ../target/release/powerfs-filer:/app/powerfs-filer:ro
    command: ["/app/powerfs-filer", "--config", "/app/config/filer.toml"]
    depends_on:
      - redis
      - master-1
      - volume-1
    logging: *default-logging

volumes:
  redis-data:
  master-rdma-data:
  volume-rdma-data:
  filer-rdma-data:
