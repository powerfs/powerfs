# PowerFS S3 服务配置
[global]
log_level = "info"
redis_url = "redis://172.20.0.50:6379"

[master]
port = 9333
net_port = 9334
dir = "/data/master"
ip = "0.0.0.0"
advertise_addr = "172.20.0.11:9333"
raft_id = 1
peers = ["172.20.0.11:9333"]

[volume]
grpc_port = 8080
http_port = 8091
net_port = 8901
data_dir = "/data/volume"
master_addresses = ["172.20.0.11:9333"]
node_id = "volume-server"
max_volume_size = 10737418240
initial_volume_count = 4

[filer]
port = 8888
grpc_port = 8889
net_port = 9334
master_addresses = ["172.20.0.11:9333"]
data_dir = "/data/filer"
shard_count = 2
raft_id = 1
raft_peers = []

[s3]
port = 9000                     # 服务端口 (必填)
master_address = "172.20.0.11:9333"  # Master地址 (必填)
dir = "/data/s3"
access_key = "powerfs"
secret_key = "powerfs123"

[fuse]
mount_point = "/mnt/powerfs"
master_addresses = ["172.20.0.11"]
filer_addresses = ["172.20.0.35"]
volume_addresses = ["172.20.0.21"]
master_net_port = 9334
volume_net_port = 8901
filer_net_port = 9334
collection = "default"
replication = "000"
threads = 8
verbose = false
container = false

[monitor]
addr = "0.0.0.0:8081"
redis_url = "redis://172.20.0.50:6379"
s3_endpoint = "http://172.20.0.32:9000"
s3_backend_endpoint = "http://172.20.0.32:9000"
master_endpoint = "http://172.20.0.11:9333"
