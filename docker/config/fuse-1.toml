# PowerFS FUSE 客户端配置 - 节点1 (容器内)
# 精简配置：只需 [global] + [fuse] 段
# filer_addresses 和 volume_addresses 省略，从 master 拓扑动态发现

[global]
log_level = "info"
redis_url = "redis://172.30.0.50:6379"

[fuse]
mount_point = "/mnt/powerfs"
master_addresses = ["172.30.0.11", "172.30.0.12", "172.30.0.13"]
master_net_port = 9334
volume_net_port = 8901
filer_net_port = 9334
collection = "default"
replication = "000"
threads = 8
verbose = true
container = true
log_file = "/var/log/powerfs-fuse.log"
# Fallback when master topology has no healthy filer shards yet.
force_mount = true
filer_addresses = ["172.30.0.31", "172.30.0.32", "172.30.0.33"]
volume_addresses = ["172.30.0.21", "172.30.0.22", "172.30.0.23",
                    "172.30.0.24", "172.30.0.25", "172.30.0.26"]
request_timeout_secs = 10
admin_port = 9998
# 客户端证书: master 有 CA 时必填。由 powerfs-cli cert sign-client 签发。
# san_ip 必须包含本节点 IP 172.30.0.41, mount_dir 必须包含 /mnt/powerfs。
ca_crt = "/etc/powerfs/certs/ca.crt"
client_crt = "/etc/powerfs/certs/fuse-client-1.crt"
client_key = "/etc/powerfs/certs/fuse-client-1.key"

[fuse.lease]
mode = "cap"                            # §13: Cap 模型，通过 cap_open_grant + CapRecallNotify 实现强一致互斥
lease_duration_ms = 30000
renew_interval_ms = 10000
