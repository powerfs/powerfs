# PowerFS Volume 节点配置 - 节点1
# 精简配置：只需 [global] + [volume] 段

[global]
log_level = "info"
redis_url = "redis://172.30.0.50:6379"

[volume]
grpc_port = 8080
http_port = 8091               # HTTP管理端口 (必须与net_port不同)
net_port = 8901                # powerfs-net端口
data_dir = "/data"
master_addresses = ["172.30.0.11:9333", "172.30.0.12:9333", "172.30.0.13:9333"]
master_net_port = 9334
node_id = "volume-server-1"
max_volume_size = 107374182400   # 100GB
initial_volume_count = 4
advertise_addr = "172.30.0.21"
