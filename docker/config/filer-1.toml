# PowerFS Filer 节点配置 - 节点1
# 精简配置：只需 [global] + [filer] 段，其他段落省略

[global]
log_level = "info"
redis_url = "redis://172.30.0.50:6379"

[filer]
transport = "auto"              # auto = RDMA with TCP fallback (#47)
port = 8888                    # HTTP端口
grpc_port = 8889               # gRPC端口
metrics_port = 8900             # Metrics HTTP端口 (必须与port/grpc_port/net_port都不同, 禁用加减推导)
net_port = 9334                # powerfs-net端口 (必须与port不同)
ip = "0.0.0.0"
master_addresses = ["172.30.0.11:9333", "172.30.0.12:9333", "172.30.0.13:9333"]
master_net_port = 9334         # Master的powerfs-net端口 (用于Zone注册)
data_dir = "/data/filer"
shard_count = 3
raft_id = 1
raft_peers = ["172.30.0.31:8889", "172.30.0.32:8889", "172.30.0.33:8889"]
inline_max_size = 8192
registration_token = "powerfs-cluster-test"  # 节点注册认证令牌 (必须与master一致)

# Certificate paths for production node authentication
ca_crt = "/etc/powerfs/certs/ca.crt"
client_crt = "/etc/powerfs/certs/filer-1.crt"
client_key = "/etc/powerfs/certs/filer-1.key"
