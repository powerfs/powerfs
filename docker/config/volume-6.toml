# PowerFS Volume 节点配置 - 节点6
# 精简配置：只需 [global] + [volume] 段

[global]
log_level = "info"
redis_url = "redis://172.30.0.50:6379"

[volume]
transport = "tcp"            # 三节点 bridge 网络无 RDMA 设备, 用 TCP
grpc_port = 8080
http_port = 8096
net_port = 8901
data_dir = "/data"
master_addresses = ["172.30.0.11:9333", "172.30.0.12:9333", "172.30.0.13:9333"]
master_net_port = 9334
node_id = "volume-server-6"
max_volume_size = 107374182400
initial_volume_count = 4
advertise_addr = "172.30.0.26"
lease_enabled = false            # 方案A: 使用inode metadata lease，Volume跳过range lease验证
force_sync_on_write = false      # 持久化策略: false=内存ack(NVMe-oF盘阵保证持久化); true=每次写强制fsync
wal_idle_sync_secs = 30   # 后台空闲 WAL fsync 间隔(秒): 0=禁用, >0 空闲时检查并 fsync 有新写入的 WAL
registration_token = "powerfs-cluster-test"  # 节点注册认证令牌 (必须与master一致)

# Certificate paths for production node authentication
ca_crt = "/etc/powerfs/certs/ca.crt"
client_crt = "/etc/powerfs/certs/volume-server-6.crt"
client_key = "/etc/powerfs/certs/volume-server-6.key"
