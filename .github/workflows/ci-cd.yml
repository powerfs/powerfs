                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 10))s..."
              sleep $((SUB_ATTEMPT * 10))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 10))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 10))
        done
        echo "::error::Checkout failed after 5 attempts"
        exit 1

    - name: Ensure Node.js
      run: |
        if ! command -v node &>/dev/null || [ "$(node -v | cut -d. -f1 | tr -d v)" -lt 20 ]; then
          echo "Node 20+ not found, installing..."
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
        fi
        node --version

    - name: Ensure pnpm
      run: |
        if ! command -v pnpm &>/dev/null; then
          npm install -g pnpm@9
        fi
        pnpm --version

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile
      working-directory: ./powerfs-monitor-frontend

    - name: Build Frontend
      run: pnpm build
      working-directory: ./powerfs-monitor-frontend

    - name: Save artifacts locally
      if: always()
      run: |
        ARTIFACT_DIR="/home/portion/actions-runner/_work/artifacts/${GITHUB_RUN_ID}"
        mkdir -p "$ARTIFACT_DIR"
        cp -r ./powerfs-monitor-frontend/dist "$ARTIFACT_DIR/" 2>/dev/null || true
        echo "Artifacts saved to: $ARTIFACT_DIR"

  # Optional check for the external S3 backend adapter. Runs on every push
  # like other jobs, but is a single shallow cargo check — cheap enough to
  # not warrant a separate workflow_dispatch. powerfs-rustfs-store is
  # intentionally excluded from the main workspace (default deploy path
  # does not need rustfs), so this job is the only CI coverage it gets.
  rustfs-check:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 100
        git config --global http.lowSpeedTime 300

    - name: Checkout code
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        git init
        git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
        git fetch --depth 1 origin "$GITHUB_SHA"
        git checkout FETCH_HEAD
        git config submodule.rustfs.url https://github.com/powerfs/rustfs.git
        git submodule update --init --force rfs_tester rustfs
        git submodule status

    - name: Ensure Rust 1.99 (rustfs requires edition 2024)
      run: |
        if rustup toolchain list | grep -q "^1\.99"; then
          rustup default 1.99
        else
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.99 --profile minimal
          . "$HOME/.cargo/env"
        fi
        rustc --version

    - name: Check powerfs-rustfs-store independently
      run: |
        cargo check --manifest-path powerfs-rustfs-store/Cargo.toml 2>&1 | tail -20
        cargo clippy --manifest-path powerfs-rustfs-store/Cargo.toml -- -D warnings
