
name: PowerFS CI/CD Pipeline

on:
  push:
    branches: [fronted, master, main]
    tags: ['v*']
  pull_request:
    branches: [fronted, master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # 代码质量检查 (fmt + clippy)
  quality:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 100
        git config --global http.lowSpeedTime 300

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3 4 5; do
          echo "--- Checkout attempt $ATTEMPT/5 ---"
          git init
          git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3 4 5; do
              echo "  submodule update attempt $SUB_ATTEMPT/5"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 10))s..."
              sleep $((SUB_ATTEMPT * 10))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 10))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 10))
        done
        echo "::error::Checkout failed after 5 attempts"
        exit 1

    - name: Ensure Rust toolchain
      run: |
        if ! command -v rustc &>/dev/null; then
          echo "Rust not found, installing via rustup..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        fi
        # Always source cargo env and persist PATH for subsequent steps
        source "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup component add rustfmt clippy 2>/dev/null || true
        rustc --version && cargo --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev libibverbs-dev
        sudo chmod 666 /dev/fuse

    - name: Topology consistency check
      run: |
        source "$HOME/.cargo/env"
        # P2: the repo no longer carries a hand-written compose. Render the
        # canonical topology from powerfs-ctl init defaults into a temp home,
        # declare the two fuse fixture clients (IPs sourced from
        # topology.env — the legacy cert-fixture source), then verify
        # topology.env and the rendered compose did not drift apart.
        cargo build --release -p powerfs-ctl
        TMP_HOME=$(mktemp -d)
        ./target/release/powerfs-ctl --home "$TMP_HOME" init
        source docker/topology.env
        for i in 0 1; do
          cat >> "$TMP_HOME/cluster.toml" <<EOF

        [client.${THREE_FUSE_IDS[$i]}]
        type = "fuse"
        ip = "${THREE_FUSE_IPS[$i]}"
        EOF
        done
        ./target/release/powerfs-ctl --home "$TMP_HOME" config render
        ./scripts/check-topology-sync.sh "$TMP_HOME/rendered/docker-compose.yml" "$TMP_HOME/cluster.toml"

    - name: IP literal lint (P4)
      run: |
        # 禁止新增硬编码私网 IP: 基线外的文件或超过基线的出现次数都会失败.
        # 清理存量后用 ./scripts/check-ip-literals.sh --update 刷新基线.
        ./scripts/check-ip-literals.sh

    - name: Format Check
      run: |
        source "$HOME/.cargo/env"
        cargo fmt --check --all

    - name: Clippy
      run: |
        source "$HOME/.cargo/env"
        cargo clippy --all -- -D warnings

  # 编译检查 (release)
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 100
        git config --global http.lowSpeedTime 300

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3 4 5; do
          echo "--- Checkout attempt $ATTEMPT/5 ---"
          git init
          git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3 4 5; do
              echo "  submodule update attempt $SUB_ATTEMPT/5"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 10))s..."
              sleep $((SUB_ATTEMPT * 10))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 10))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 10))
        done
        echo "::error::Checkout failed after 5 attempts"
        exit 1

    - name: Ensure Rust toolchain
      run: |
        if ! command -v rustc &>/dev/null; then
          echo "Rust not found, installing via rustup..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        fi
        source "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustc --version && cargo --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev libibverbs-dev
        sudo chmod 666 /dev/fuse

    - name: Build All
      run: |
        source "$HOME/.cargo/env"
        cargo build --all --release

  # 单元测试 + FUSE 集成测试
  test:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 100
        git config --global http.lowSpeedTime 300

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3 4 5; do
          echo "--- Checkout attempt $ATTEMPT/5 ---"
          git init
          git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3 4 5; do
              echo "  submodule update attempt $SUB_ATTEMPT/5"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 10))s..."
              sleep $((SUB_ATTEMPT * 10))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 10))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 10))
        done
        echo "::error::Checkout failed after 5 attempts"
        exit 1

    - name: Ensure Rust toolchain
      run: |
        if ! command -v rustc &>/dev/null; then
          echo "Rust not found, installing via rustup..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        fi
        source "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustc --version && cargo --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev libibverbs-dev
        sudo chmod 666 /dev/fuse

    - name: Unit Tests
      run: |
        source "$HOME/.cargo/env"
        cargo test --all -- --test-threads=2

    - name: Benchmark Tests
      run: |
        source "$HOME/.cargo/env"
        cargo test --package powerfs-core --test storage_benchmark_test -- --test-threads=1

    - name: Check if FUSE is available
      id: fuse-check
      run: |
        if [ -c /dev/fuse ] && sudo fusermount -V 2>/dev/null; then
          echo "fuse_available=true" >> $GITHUB_OUTPUT
          echo "FUSE is available"
        else
          echo "fuse_available=false" >> $GITHUB_OUTPUT
          echo "FUSE is NOT available, skipping integration tests"
        fi

    - name: Run FUSE integration tests
      if: steps.fuse-check.outputs.fuse_available == 'true'
      run: |
        source "$HOME/.cargo/env"
        cargo test --package powerfs-fuse --test fuse_minimal_test --verbose
        cargo test --package powerfs-fuse --test fuse_basic_test --verbose
        cargo test --package powerfs-fuse --test coherence_phase0_test --verbose
        cargo test --package powerfs-fuse --test coherence_phase1_test --verbose
        cargo test --package powerfs-fuse --test invalidation_e2e_test --verbose

  # 基准测试 (criterion)
  benchmark:
    runs-on: [self-hosted, Linux, X64]
    needs: test
    if: github.event_name == 'workflow_dispatch' || (contains(fromJson('["refs/heads/fronted","refs/heads/master","refs/heads/main"]'), github.ref) && github.event_name == 'push')
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 100
        git config --global http.lowSpeedTime 300

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3 4 5; do
          echo "--- Checkout attempt $ATTEMPT/5 ---"
          git init
          git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3 4 5; do
              echo "  submodule update attempt $SUB_ATTEMPT/5"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 10))s..."
              sleep $((SUB_ATTEMPT * 10))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 10))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 10))
        done
        echo "::error::Checkout failed after 5 attempts"
        exit 1

    - name: Ensure Rust toolchain
      run: |
        if ! command -v rustc &>/dev/null; then
          echo "Rust not found, installing via rustup..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        fi
        source "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustc --version && cargo --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev libibverbs-dev
        sudo chmod 666 /dev/fuse

    - name: Build Benchmark
      run: |
        source "$HOME/.cargo/env"
        cargo build --package powerfs-core --release --bench kv_benchmark

    - name: Run Benchmark
      run: |
        source "$HOME/.cargo/env"
        mkdir -p benchmark-results
        cargo bench --package powerfs-core --bench kv_benchmark -- --save-baseline baseline
      env:
        BENCHMARK_RESULTS_DIR: ./benchmark-results

    - name: Save artifacts locally
      if: always()
      run: |
        ARTIFACT_DIR="/home/portion/actions-runner/_work/artifacts/${GITHUB_RUN_ID}"
        mkdir -p "$ARTIFACT_DIR"
        cp -r ./benchmark-results "$ARTIFACT_DIR/" 2>/dev/null || true
        echo "Artifacts saved to: $ARTIFACT_DIR"

  # 代码覆盖率
  coverage:
    needs: test
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 100
        git config --global http.lowSpeedTime 300

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3 4 5; do
          echo "--- Checkout attempt $ATTEMPT/5 ---"
          git init
          git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3 4 5; do
              echo "  submodule update attempt $SUB_ATTEMPT/5"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 10))s..."
              sleep $((SUB_ATTEMPT * 10))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 10))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 10))
        done
        echo "::error::Checkout failed after 5 attempts"
        exit 1

    - name: Ensure Rust toolchain
      run: |
        if ! command -v rustc &>/dev/null; then
          echo "Rust not found, installing via rustup..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        fi
        source "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup component add llvm-tools-preview 2>/dev/null || true
        rustc --version && cargo --version

    - name: Install grcov
      run: |
        source "$HOME/.cargo/env"
        cargo install grcov

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev libibverbs-dev
        sudo chmod 666 /dev/fuse

    - name: Run Tests with Coverage
      run: |
        source "$HOME/.cargo/env"
        cargo clean
        RUSTFLAGS="-C instrument-coverage" cargo build --all
        RUSTFLAGS="-C instrument-coverage" cargo test --all
      env:
        LLVM_PROFILE_FILE: "powerfs-%p-%m.profraw"

    - name: Generate Coverage Report
      run: |
        source "$HOME/.cargo/env"
        grcov . --binary-path ./target/debug/deps/ -s . -t html --branch --ignore-not-existing -o ./coverage

    - name: Save artifacts locally
      if: always()
      run: |
        ARTIFACT_DIR="/home/portion/actions-runner/_work/artifacts/${GITHUB_RUN_ID}"
        mkdir -p "$ARTIFACT_DIR"
        cp -r ./coverage "$ARTIFACT_DIR/" 2>/dev/null || true
        echo "Artifacts saved to: $ARTIFACT_DIR"

  # Docker 镜像构建 (使用 GHCR, 无需外部凭据)
  docker:
    runs-on: [self-hosted, Linux, X64]
    needs: [quality, build, test]
    if: >-
      ((github.ref == 'refs/heads/fronted' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        || startsWith(github.ref, 'refs/tags/v'))
      && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 100
        git config --global http.lowSpeedTime 300

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3 4 5; do
          echo "--- Checkout attempt $ATTEMPT/5 ---"
          git init
          git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3 4 5; do
              echo "  submodule update attempt $SUB_ATTEMPT/5"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 10))s..."
              sleep $((SUB_ATTEMPT * 10))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 10))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 10))
        done
        echo "::error::Checkout failed after 5 attempts"
        exit 1

    - name: Ensure Rust toolchain
      run: |
        if ! command -v rustc &>/dev/null; then
          echo "Rust not found, installing via rustup..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        fi
        source "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustc --version && cargo --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev libibverbs-dev

    - name: Build Release Binaries
      run: |
        source "$HOME/.cargo/env"
        cargo build --all --release

    - name: Setup Docker (buildx already configured)
      run: |
        docker info | head -5
        docker buildx version 2>/dev/null || docker buildx create --use --driver docker

    - name: Pull base image via mirror
      run: |
        # self-hosted runner 无法直连 Docker Hub (registry-1.docker.io 超时),
        # 先看本地缓存, 再依次尝试直连 + 可达的公共镜像源; 拉取后重新打回
        # 基础镜像 tag, 供 docker/Dockerfile 的 FROM ubuntu:20.04 本地复用.
        BASE_IMAGE="ubuntu:20.04"
        if docker image inspect "$BASE_IMAGE" >/dev/null 2>&1; then
          echo "base image $BASE_IMAGE already present locally"
          exit 0
        fi
        CANDIDATES=(
          "$BASE_IMAGE"
          "docker.m.daocloud.io/library/$BASE_IMAGE"
          "docker.1ms.run/library/$BASE_IMAGE"
        )
        for IMG in "${CANDIDATES[@]}"; do
          echo "--- trying $IMG ---"
          if timeout 180 docker pull "$IMG"; then
            if [ "$IMG" != "$BASE_IMAGE" ]; then
              docker tag "$IMG" "$BASE_IMAGE"
              docker rmi "$IMG" >/dev/null 2>&1 || true
            fi
            docker image inspect "$BASE_IMAGE" >/dev/null 2>&1 && { echo "got $BASE_IMAGE"; exit 0; }
          fi
        done
        echo "::error::failed to pull $BASE_IMAGE from Docker Hub and all mirrors"
        exit 1

    - name: Login to GHCR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Build and Push PowerFS Image
      run: |
        # 用 github.repository 而非固定的 owner/powerfs：private 仓库
        # (powerfs/powerfs-private) 的 GITHUB_TOKEN 无权写入 public 仓库
        # 创建的 ghcr.io/powerfs/powerfs 包，导致 docker job permission_denied。
        # 按仓库名推送后各推各的包，从根本上避免跨仓库权限冲突。
        IMAGE_TAG="ghcr.io/${{ github.repository }}"
        # 不传 --pull: 上面经镜像源拉取并打回 tag 的本地 ubuntu:20.04 会被
        # BuildKit 直接复用 (pull policy=missing), 不回源 registry-1.docker.io.
        docker build -f docker/Dockerfile -t "${IMAGE_TAG}:latest" -t "${IMAGE_TAG}:${GITHUB_SHA}" .
        docker push "${IMAGE_TAG}:latest"
        docker push "${IMAGE_TAG}:${GITHUB_SHA}"

    - name: Build and Push Demo Image
      run: |
        # Self-contained trial image (redis+master+filer+volume+fuse in one
        # container). Release tags get an additional :vX.Y.Z tag.
        DEMO_TAG="ghcr.io/${{ github.repository }}-demo"
        docker build -f docker/demo/Dockerfile \
          -t "${DEMO_TAG}:latest" -t "${DEMO_TAG}:${GITHUB_SHA}" .
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          docker tag "${DEMO_TAG}:latest" "${DEMO_TAG}:${GITHUB_REF_NAME}"
        fi
        docker push "${DEMO_TAG}:latest"
        docker push "${DEMO_TAG}:${GITHUB_SHA}"
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          docker push "${DEMO_TAG}:${GITHUB_REF_NAME}"
        fi

  # 部署到测试环境
  deploy-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [docker]
    if: contains(fromJson('["refs/heads/fronted","refs/heads/master","refs/heads/main"]'), github.ref) && github.event_name == 'push'
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 100
        git config --global http.lowSpeedTime 300

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3 4 5; do
          echo "--- Checkout attempt $ATTEMPT/5 ---"
          git init
          git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3 4 5; do
              echo "  submodule update attempt $SUB_ATTEMPT/5"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 10))s..."
              sleep $((SUB_ATTEMPT * 10))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 10))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 10))
        done
        echo "::error::Checkout failed after 5 attempts"
        exit 1

    - name: Deploy to Test Cluster
      run: |
        echo "Deploying to test environment..."
        # 替换为实际的部署命令
        # kubectl apply -f k8s/test/

  # 发布版本
  release:
    runs-on: [self-hosted, Linux, X64]
    needs: [quality, build, test, docker, deploy-test]
    if: contains(github.event.head_commit.message, 'release')
    steps:
    - name: Configure Git for SSH
      run: |
