                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 5))s..."
              sleep $((SUB_ATTEMPT * 5))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 5))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 5))
        done
        echo "::error::Checkout failed after 3 attempts"
        exit 1

    - name: Ensure Rust toolchain
      run: |
        if ! command -v rustc &>/dev/null; then
          echo "Rust not found, installing via rustup..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        fi
        source "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustc --version && cargo --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev

    - name: Build Release Binaries
      run: |
        source "$HOME/.cargo/env"
        cargo build --all --release

    - name: Setup Docker (buildx already configured)
      run: |
        docker info | head -5
        docker buildx version 2>/dev/null || docker buildx create --use --driver docker

    - name: Pull base image via mirror
      run: docker pull ubuntu:20.04

    - name: Login to GHCR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Build and Push PowerFS Image
      run: |
        IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/powerfs"
        docker build -f docker/Dockerfile -t "${IMAGE_TAG}:latest" -t "${IMAGE_TAG}:${GITHUB_SHA}" .
        docker push "${IMAGE_TAG}:latest"
        docker push "${IMAGE_TAG}:${GITHUB_SHA}"

  # 部署到测试环境
  deploy-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [docker]
    if: contains(fromJson('["refs/heads/fronted","refs/heads/master","refs/heads/main"]'), github.ref) && github.event_name == 'push'
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3; do
          echo "--- Checkout attempt $ATTEMPT/3 ---"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3; do
              echo "  submodule update attempt $SUB_ATTEMPT/3"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 5))s..."
              sleep $((SUB_ATTEMPT * 5))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 5))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 5))
        done
        echo "::error::Checkout failed after 3 attempts"
        exit 1

    - name: Deploy to Test Cluster
      run: |
        echo "Deploying to test environment..."
        # 替换为实际的部署命令
        # kubectl apply -f k8s/test/

  # 发布版本
  release:
    runs-on: [self-hosted, Linux, X64]
    needs: [quality, build, test, docker, deploy-test]
    if: contains(github.event.head_commit.message, 'release')
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3; do
          echo "--- Checkout attempt $ATTEMPT/3 ---"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3; do
              echo "  submodule update attempt $SUB_ATTEMPT/3"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 5))s..."
              sleep $((SUB_ATTEMPT * 5))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 5))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 5))
        done
        echo "::error::Checkout failed after 3 attempts"
        exit 1

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${GITHUB_RUN_NUMBER}"
        BODY="**Changes in this release:**\n\n- See commit history for details"
        curl -s -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
          -d "{\"tag_name\":\"${TAG}\",\"name\":\"Release ${TAG}\",\"body\":\"${BODY}\",\"draft\":false,\"prerelease\":false}" \
          -w "\nHTTP: %{http_code}\n"

  # 前端构建
  frontend:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - name: Checkout code (local git clone — with retry)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        # Robust workspace cleanup: remove everything including .git
        git clean -ffdx 2>/dev/null || true
        rm -rf .git ./* ./.[!.]* 2>/dev/null || true
        sleep 1  # brief pause to release file handles
        for ATTEMPT in 1 2 3; do
          echo "--- Checkout attempt $ATTEMPT/3 ---"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin "$GITHUB_SHA" 2>&1; then
            git checkout FETCH_HEAD
            # Submodule update with retry
            for SUB_ATTEMPT in 1 2 3; do
              echo "  submodule update attempt $SUB_ATTEMPT/3"
              rm -rf rfs_tester .git/modules/rfs_tester 2>/dev/null || true
              if git submodule update --init --force rfs_tester 2>&1; then
                git -C rfs_tester checkout --force HEAD 2>/dev/null || true
                echo "Checked out: $(git log --oneline -1)"
                exit 0
              fi
              echo "  submodule attempt $SUB_ATTEMPT failed, retrying in $((SUB_ATTEMPT * 5))s..."
              sleep $((SUB_ATTEMPT * 5))
            done
          fi
          echo "attempt $ATTEMPT failed, cleaning up and retrying in $((ATTEMPT * 5))s..."
          git clean -ffdx 2>/dev/null || true
          rm -rf .git ./* ./.[!.]* 2>/dev/null || true
          sleep $((ATTEMPT * 5))
        done
        echo "::error::Checkout failed after 3 attempts"
        exit 1

    - name: Ensure Node.js
      run: |
        if ! command -v node &>/dev/null || [ "$(node -v | cut -d. -f1 | tr -d v)" -lt 20 ]; then
          echo "Node 20+ not found, installing..."
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
        fi
        node --version

    - name: Ensure pnpm
      run: |
        if ! command -v pnpm &>/dev/null; then
          npm install -g pnpm@9
        fi
        pnpm --version

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile
      working-directory: ./powerfs-monitor-frontend

    - name: Build Frontend
      run: pnpm build
      working-directory: ./powerfs-monitor-frontend

    - name: Save artifacts locally
      if: always()
      run: |
        ARTIFACT_DIR="/home/portion/actions-runner/_work/artifacts/${GITHUB_RUN_ID}"
        mkdir -p "$ARTIFACT_DIR"
        cp -r ./powerfs-monitor-frontend/dist "$ARTIFACT_DIR/" 2>/dev/null || true
        echo "Artifacts saved to: $ARTIFACT_DIR"
