
name: PowerFS CI/CD Pipeline

on:
  push:
    branches: [ fronted, "fs-lease-optimize", "allocator-decoupling", master, main ]
  pull_request:
    branches: [ fronted, "fs-lease-optimize", "allocator-decoupling", master, main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # 代码质量检查
  quality:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Checkout public submodules
      run: |
        git submodule update --init --force rfs_tester
        git -C rfs_tester checkout --force HEAD

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev
        sudo chmod 666 /dev/fuse

    - name: Cargo Cache
      uses: Swatinem/rust-cache@v2

    - name: Format Check
      run: cargo fmt --check --all

    - name: Clippy
      run: cargo clippy --all -- -D warnings

  # 编译检查
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Checkout public submodules
      run: |
        git submodule update --init --force rfs_tester
        git -C rfs_tester checkout --force HEAD

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev
        sudo chmod 666 /dev/fuse

    - name: Cargo Cache
      uses: Swatinem/rust-cache@v2

    - name: Build All
      run: cargo build --all --release

  # 单元测试
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Checkout public submodules
      run: |
        git submodule update --init --force rfs_tester
        git -C rfs_tester checkout --force HEAD

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev
        sudo chmod 666 /dev/fuse

    - name: Cargo Cache
      uses: Swatinem/rust-cache@v2

    - name: Unit Tests
      run: cargo test --all -- --test-threads=2

    - name: Benchmark Tests
      run: cargo test --package powerfs-core --test storage_benchmark_test -- --test-threads=1

  # 基准测试
  benchmark:
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'workflow_dispatch' || (contains(fromJson('["refs/heads/fronted","refs/heads/master","refs/heads/main"]'), github.ref) && github.event_name == 'push')
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Checkout public submodules
      run: |
        git submodule update --init --force rfs_tester
        git -C rfs_tester checkout --force HEAD

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev
        sudo chmod 666 /dev/fuse

    - name: Cargo Cache
      uses: Swatinem/rust-cache@v2

    - name: Build Benchmark
      run: cargo build --package powerfs-core --release --bench kv_benchmark

    - name: Run Benchmark
      run: |
        mkdir -p benchmark-results
        cargo bench --package powerfs-core --bench kv_benchmark -- --save-baseline baseline
      env:
        BENCHMARK_RESULTS_DIR: ./benchmark-results

    - name: Upload Benchmark Results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: ./benchmark-results

  # 代码覆盖率
  coverage:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Checkout public submodules
      run: |
        git submodule update --init --force rfs_tester
        git -C rfs_tester checkout --force HEAD

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install grcov
      run: cargo install grcov

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libfuse-dev fuse3 pkg-config libssl-dev
        sudo chmod 666 /dev/fuse

    - name: Cargo Cache
      uses: Swatinem/rust-cache@v2

    - name: Run Tests with Coverage
      run: |
        cargo clean
        RUSTFLAGS="-C instrument-coverage" cargo build --all
        RUSTFLAGS="-C instrument-coverage" cargo test --all
      env:
        LLVM_PROFILE_FILE: "powerfs-%p-%m.profraw"

    - name: Generate Coverage Report
      run: grcov . --binary-path ./target/debug/deps/ -s . -t html --branch --ignore-not-existing -o ./coverage

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage

  # Check whether Docker Hub credentials are configured (secrets context is
  # not available in job-level `if`, so we expose it via a job output).
  check-docker-secrets:
    runs-on: [self-hosted, Linux, X64]
    if: (github.ref == 'refs/heads/fronted' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
    - id: check
      run: |
        if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "::warning::Docker Hub credentials (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) are not configured; skipping docker/deploy/release jobs."
          echo "available=false" >> $GITHUB_OUTPUT
        fi

  # Docker 镜像构建
  docker:
    runs-on: [self-hosted, Linux, X64]
    needs: [quality, build, test, check-docker-secrets]
    if: (github.ref == 'refs/heads/fronted' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push' && needs.check-docker-secrets.outputs.available == 'true'
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Master Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/powerfs-master.Dockerfile
        push: true
        tags: powerfs/master:latest, powerfs/master:${{ github.sha }}

    - name: Build and Push Volume Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/powerfs-volume.Dockerfile
        push: true
        tags: powerfs/volume:latest, powerfs/volume:${{ github.sha }}

    - name: Build and Push FUSE Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/powerfs-fuse.Dockerfile
        push: true
        tags: powerfs/fuse:latest, powerfs/fuse:${{ github.sha }}

    - name: Build and Push Monitor Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/powerfs-monitor.Dockerfile
        push: true
        tags: powerfs/monitor:latest, powerfs/monitor:${{ github.sha }}

  # 部署到测试环境
  deploy-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [docker]
    if: contains(fromJson('["refs/heads/fronted","refs/heads/master","refs/heads/main"]'), github.ref) && github.event_name == 'push'
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Deploy to Test Cluster
      run: |
        echo "Deploying to test environment..."
        # 替换为实际的部署命令
        # kubectl apply -f k8s/test/

  # 发布版本
  release:
    runs-on: [self-hosted, Linux, X64]
    needs: [quality, build, test, docker, deploy-test]
    if: contains(github.event.head_commit.message, 'release')
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          **Changes in this release:**
          
          - See commit history for details
        draft: false
        prerelease: false

  # 前端构建
  frontend:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile
      working-directory: ./powerfs-monitor-frontend

    - name: Build Frontend
      run: pnpm build
      working-directory: ./powerfs-monitor-frontend
    
    - name: Upload Frontend Build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: ./powerfs-monitor-frontend/dist
