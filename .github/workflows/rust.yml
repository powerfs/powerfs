name: Rust CI

on:
  push:
    branches: [ fronted, "fs-lease-optimize", "allocator-decoupling", master, main ]
  pull_request:
    branches: [ fronted, "fs-lease-optimize", "allocator-decoupling", master, main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]

    steps:
    - name: Configure Git for SSH
      run: |
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    - name: Checkout public submodules
      run: |
        git submodule update --init --force rfs_tester
        git -C rfs_tester checkout --force HEAD

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            protobuf-compiler \
            libfuse-dev \
            fuse3 \
            pkg-config \
            libssl-dev
        sudo chmod 666 /dev/fuse
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-
    
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-
    
    - name: Cache target directory
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-target-
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Clippy
      run: cargo clippy --all -- -D warnings
    
    - name: Build
      run: cargo build --all --verbose
    
    - name: Run unit tests (no FUSE)
      run: cargo test --all --lib --verbose

    - name: Check if FUSE is available
      id: fuse-check
      run: |
        if [ -c /dev/fuse ] && sudo fusermount -V 2>/dev/null; then
          echo "fuse_available=true" >> $GITHUB_OUTPUT
          echo "FUSE is available"
        else
          echo "fuse_available=false" >> $GITHUB_OUTPUT
          echo "FUSE is NOT available, skipping integration tests"
        fi

    - name: Run FUSE integration tests
      if: steps.fuse-check.outputs.fuse_available == 'true'
      run: |
        cargo test --package powerfs-fuse --test fuse_minimal_test --verbose
        cargo test --package powerfs-fuse --test fuse_basic_test --verbose
        cargo test --package powerfs-fuse --test coherence_phase0_test --verbose
        cargo test --package powerfs-fuse --test coherence_phase1_test --verbose
        cargo test --package powerfs-master --test e2e_test --verbose
        cargo test --package powerfs-master --test raft_integration_test --verbose
