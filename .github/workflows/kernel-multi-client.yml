name: Kernel Multi-Client Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'kernel/powerfs_mod/**'
      - '.github/workflows/kernel-multi-client.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'kernel/powerfs_mod/**'
      - '.github/workflows/kernel-multi-client.yml'
  schedule:
    # Nightly full test at 02:00 UTC (10:00 CST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode (smoke or full)'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: kernel-multi-client-${{ github.ref }}
  cancel-in-progress: true

env:
  VM1_SSH_PORT: "2223"
  VM2_SSH_PORT: "2224"
  TEST_MODE: ${{ github.event_name == 'schedule' && 'full' || (github.event.inputs.mode || 'smoke') }}
  WAIT_NOTIFY_DEFAULT: "5"

jobs:
  multi-client-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - name: Checkout code (local git clone — bypasses codeload IP rate limit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Self-hosted runner hits codeload.github.com 429 (IP-based rate limit)
          # when downloading actions/checkout. Use direct git clone instead.
          cd "$GITHUB_WORKSPACE"
          # Clean workspace (runner ensures it's empty, but be defensive)
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1
          echo "Checked out: $(git log --oneline -1)"

      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM not available (/dev/kvm missing)"
            exit 1
          fi
          echo "KVM available: $(ls -la /dev/kvm)"

      - name: Check Docker services (powerfs backend)
        run: |
          # Verify powerfs backend containers are running
          docker ps --format '{{.Names}}' | grep -E 'master|volume|filer' || {
            echo "::error::PowerFS backend containers not running"
            echo "Available containers:"
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            exit 1
          }
          echo "PowerFS backend OK"

      - name: Build kernel module
        run: |
          cd kernel/powerfs_mod
          make clean || true
          make -j$(nproc) 2>&1 | tail -5
          ls -la powerfs.ko

      - name: Prepare kernel image (prebuilt or build)
        run: |
          OUTPUT_DIR="kernel/vm/output"
          PREBUILT_DIR="/home/portion/powerfs/kernel/vm/output"
          mkdir -p "$OUTPUT_DIR"

          # Try prebuilt kernel from runner first (faster)
          if [ -f "$PREBUILT_DIR/bzImage" ] && [ -f "$PREBUILT_DIR/initramfs.cpio.gz" ]; then
            echo "=== Using prebuilt kernel from runner ==="
            cp "$PREBUILT_DIR/bzImage" "$OUTPUT_DIR/bzImage"
            cp "$PREBUILT_DIR/initramfs.cpio.gz" "$OUTPUT_DIR/initramfs.cpio.gz"
            ls -lh "$OUTPUT_DIR/bzImage" "$OUTPUT_DIR/initramfs.cpio.gz"
          elif [ ! -f "$OUTPUT_DIR/bzImage" ] || [ ! -f "$OUTPUT_DIR/initramfs.cpio.gz" ]; then
            echo "=== Building kernel and initramfs ==="
            cd kernel/vm
            # KERNEL_SOURCE must be set in CI env or runner
            if [ ! -d "${KERNEL_SOURCE:-/home/portion/powerfs/linux-6.17}" ]; then
              echo "::error::KERNEL_SOURCE not found: ${KERNEL_SOURCE:-/home/portion/powerfs/linux-6.17}"
              echo "Set KERNEL_SOURCE env var or prebuild kernel at $PREBUILT_DIR"
              exit 1
            fi
            bash build_kernel.sh 2>&1 | tail -5
            bash build_initramfs.sh 2>&1 | tail -5
          else
            echo "=== Kernel image already exists, skipping build ==="
            ls -lh "$OUTPUT_DIR/bzImage" "$OUTPUT_DIR/initramfs.cpio.gz"
          fi

      - name: Setup network for dual VM
        run: |
          cd kernel/vm
          # Setup tap0 (VM1) and tap1 (VM2)
          sudo bash setup_network.sh || true
          sudo bash setup_network_dual.sh || true
          # Verify tap devices
          ip link show tap0 && ip link show tap1

      - name: Deploy powerfs.ko to share directory
        run: |
          mkdir -p kernel/vm/share
          cp kernel/powerfs_mod/powerfs.ko kernel/vm/share/powerfs.ko
          ls -la kernel/vm/share/powerfs.ko

      - name: Start VM1
        run: |
          cd kernel/vm
          # Kill any existing VMs
          sudo pkill -f "qemu.*2223" 2>/dev/null || true
          sleep 1
          # Start VM1 in background
          sudo nohup bash run_qemu_kernel_ssh.sh > /tmp/vm1_boot.log 2>&1 &
          echo "VM1 starting (PID: $!)"
          # Wait for VM1 to be ready
          echo "Waiting for VM1 SSH..."
          for i in $(seq 1 60); do
            if ssh -p ${{ env.VM1_SSH_PORT }} -o StrictHostKeyChecking=no -o ConnectTimeout=2 root@localhost "true" 2>/dev/null; then
              echo "VM1 SSH ready after ${i}s"
              break
            fi
            sleep 1
            [ $i -eq 60 ] && { echo "::error::VM1 SSH not ready after 60s"; cat /tmp/vm1_boot.log | tail -20; exit 1; }
          done

      - name: Start VM2
        run: |
          cd kernel/vm
          sudo pkill -f "qemu.*2224" 2>/dev/null || true
          sleep 1
          sudo nohup bash run_qemu_vm2.sh > /tmp/vm2_boot.log 2>&1 &
          echo "VM2 starting (PID: $!)"
          echo "Waiting for VM2 SSH..."
          for i in $(seq 1 60); do
            if ssh -p ${{ env.VM2_SSH_PORT }} -o StrictHostKeyChecking=no -o ConnectTimeout=2 root@localhost "true" 2>/dev/null; then
              echo "VM2 SSH ready after ${i}s"
              break
            fi
            sleep 1
            [ $i -eq 60 ] && { echo "::error::VM2 SSH not ready after 60s"; cat /tmp/vm2_boot.log | tail -20; exit 1; }
          done

      - name: Deploy powerfs.ko and mount on both VMs
        run: |
          for PORT in ${{ env.VM1_SSH_PORT }} ${{ env.VM2_SSH_PORT }}; do
            echo "=== Deploying to VM (port $PORT) ==="
            ssh -p $PORT -o StrictHostKeyChecking=no root@localhost sh <<'REMOTE_EOF'
              # Unmount and unload if already loaded
              umount /mnt/pfs 2>/dev/null || umount -l /mnt/pfs 2>/dev/null || true
              rmmod powerfs 2>/dev/null || true

              # Check 9p share
              if [ ! -f /mnt/host/powerfs.ko ]; then
                echo "ERROR: /mnt/host/powerfs.ko not found"
                echo "9p mount status:"
                mount | grep 9p || echo "9p NOT mounted"
                ls -la /mnt/host/ 2>/dev/null || echo "/mnt/host not accessible"
                exit 1
              fi

              # Deploy
              cp /mnt/host/powerfs.ko /root/powerfs.ko
              insmod /root/powerfs.ko master_addr=172.30.0.11,172.30.0.12,172.30.0.13 master_port=9334 shard_count=3
              mkdir -p /mnt/pfs
              mount -t powerfs none /mnt/pfs -o master_addr=172.30.0.11,master_port=9334

              # Verify
              if mount | grep -q powerfs; then
                echo "Deploy OK: $(mount | grep powerfs | head -1)"
              else
                echo "ERROR: powerfs mount failed"
                dmesg | tail -10
                exit 1
              fi
          REMOTE_EOF
            if [ $? -ne 0 ]; then
              echo "::error::Deploy failed on port $PORT"
              exit 1
            fi
          done

      - name: Record dmesg baseline
        id: dmesg_baseline
        run: |
          BASE_A=$(ssh -p ${{ env.VM1_SSH_PORT }} -o StrictHostKeyChecking=no root@localhost "dmesg | wc -l")
          BASE_B=$(ssh -p ${{ env.VM2_SSH_PORT }} -o StrictHostKeyChecking=no root@localhost "dmesg | wc -l")
          echo "BASE_A=$BASE_A" >> $GITHUB_OUTPUT
          echo "BASE_B=$BASE_B" >> $GITHUB_OUTPUT
          echo "dmesg baseline: VM1=$BASE_A VM2=$BASE_B lines"

      - name: Verify VM2 can see VM1's files
        run: |
          # Diagnostics: network connectivity and powerfs health
          echo "=== VM1 network test (ping master) ==="
          ssh -p ${{ env.VM1_SSH_PORT }} -o StrictHostKeyChecking=no root@localhost "ping -c 1 -W 2 172.30.0.11 2>&1 || echo PING_FAILED"
          echo "=== VM2 network test (ping master) ==="
          ssh -p ${{ env.VM2_SSH_PORT }} -o StrictHostKeyChecking=no root@localhost "ping -c 1 -W 2 172.30.0.11 2>&1 || echo PING_FAILED"
          echo "=== VM1 powerfs dmesg ==="
          ssh -p ${{ env.VM1_SSH_PORT }} -o StrictHostKeyChecking=no root@localhost "dmesg | grep -i powerfs | tail -15"
          echo "=== VM2 powerfs dmesg ==="
          ssh -p ${{ env.VM2_SSH_PORT }} -o StrictHostKeyChecking=no root@localhost "dmesg | grep -i powerfs | tail -15"

          # Create a test file on VM1
          echo "=== Creating test file on VM1 ==="
          ssh -p ${{ env.VM1_SSH_PORT }} -o StrictHostKeyChecking=no root@localhost "echo test > /mnt/pfs/ci_conn_test" 2>&1 || {
            echo "::error::VM1 cannot create file on powerfs"
            echo "=== VM1 dmesg (last 20) ==="
            ssh -p ${{ env.VM1_SSH_PORT }} root@localhost "dmesg | tail -20"
            exit 1
          }
          sleep 5
          # Check on VM2
          RESULT=$(ssh -p ${{ env.VM2_SSH_PORT }} -o StrictHostKeyChecking=no root@localhost "cat /mnt/pfs/ci_conn_test 2>/dev/null || echo NOT_FOUND")
          if [ "$RESULT" = "test" ]; then
            echo "VM2 can see VM1's files: OK"
          else
            echo "::error::VM2 cannot see VM1's files (got: $RESULT)"
            echo "=== VM1 root dir ==="
            ssh -p ${{ env.VM1_SSH_PORT }} root@localhost "ls -la /mnt/pfs/ | head -10"
            echo "=== VM2 root dir ==="
            ssh -p ${{ env.VM2_SSH_PORT }} root@localhost "ls -la /mnt/pfs/ | head -10"
            exit 1
          fi
          # Cleanup
          ssh -p ${{ env.VM1_SSH_PORT }} -o StrictHostKeyChecking=no root@localhost "rm -f /mnt/pfs/ci_conn_test"

      - name: Run multi-client tests
        id: test
        run: |
          cd kernel/vm
          echo "Test mode: ${{ env.TEST_MODE }}"
          bash test_multi_client.sh \
            --mode=${{ env.TEST_MODE }} \
            --output=junit \
            --junit-file=/tmp/multi-client-results.xml \
            --dmesg-check \
            2>&1 | tee /tmp/multi-client-output.log
          # Capture exit code (don't fail immediately, dmesg check may add context)
          TEST_EXIT=${PIPESTATUS[0]}
          echo "TEST_EXIT=$TEST_EXIT" >> $GITHUB_OUTPUT
          # Show summary
          tail -5 /tmp/multi-client-output.log
          exit $TEST_EXIT

      - name: Check dmesg for anomalies (SLUB, oops, etc.)
        if: always()
        run: |
          cd kernel/vm
          BASE_A="${{ steps.dmesg_baseline.outputs.BASE_A }}"
          BASE_B="${{ steps.dmesg_baseline.outputs.BASE_B }}"
          DMESG_FAIL=0
          bash check_dmesg_anomaly.sh --port=${{ env.VM1_SSH_PORT }} --baseline=$BASE_A --label=VM1 || DMESG_FAIL=1
          bash check_dmesg_anomaly.sh --port=${{ env.VM2_SSH_PORT }} --baseline=$BASE_B --label=VM2 || DMESG_FAIL=1
          if [ "$DMESG_FAIL" = "1" ]; then
            echo "::error::dmesg anomaly detected — blocking CI"
            exit 1
          fi
          echo "dmesg check passed on both VMs"

      - name: Save test artifacts (local — bypasses actions/upload-artifact)
        if: always()
        run: |
          # Self-hosted runner: save artifacts locally instead of upload-artifact action
          ARTIFACT_DIR="/home/portion/actions-runner/_work/artifacts/${GITHUB_RUN_ID}"
          mkdir -p "$ARTIFACT_DIR"
          for f in /tmp/multi-client-results.xml /tmp/multi-client-output.log /tmp/vm1_boot.log /tmp/vm2_boot.log; do
            [ -f "$f" ] && cp "$f" "$ARTIFACT_DIR/" && echo "Saved: $f"
          done
          echo "Artifacts directory: $ARTIFACT_DIR"
          ls -la "$ARTIFACT_DIR" || true

      - name: Publish JUnit summary to job log
        if: always() && hashFiles('/tmp/multi-client-results.xml') != ''
        run: |
          # Inline JUnit summary (replaces dorny/test-reporter to avoid codeload dependency)
          if [ -f /tmp/multi-client-results.xml ]; then
            python3 - <<'PY'
            import xml.etree.ElementTree as ET
            try:
                tree = ET.parse('/tmp/multi-client-results.xml')
                root = tree.getroot()
                total=fail=err=skip=0
                for tc in root.iter('testcase'):
                    total += 1
                    if tc.find('failure') is not None: fail += 1
                    elif tc.find('error') is not None: err += 1
                    elif tc.find('skipped') is not None: skip += 1
                passed = total - fail - err - skip
                print(f"::notice::JUnit Summary: {passed} passed, {fail} failures, {err} errors, {skip} skipped (total {total})")
                # List failures
                for tc in root.iter('testcase'):
                    f = tc.find('failure')
                    e = tc.find('error')
                    if f is not None:
                        print(f"::error::FAIL {tc.get('name','?')}: {f.text[:200] if f.text else ''}")
                    elif e is not None:
                        print(f"::error::ERROR {tc.get('name','?')}: {e.text[:200] if e.text else ''}")
            except Exception as ex:
                print(f"::warning::Could not parse JUnit XML: {ex}")
            PY
          else
            echo "No JUnit XML found"
          fi

      - name: Create issue on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create issue via GitHub API (replaces actions/github-script)
          LOG_SUMMARY=$(grep -E 'PASS:|FAIL:|SKIP:|Results:' /tmp/multi-client-output.log 2>/dev/null | tail -10 || echo "Unable to read log")
          MODE="${{ env.TEST_MODE }}"
          COMMIT=$(echo "$GITHUB_SHA" | cut -c1-7)
          RUN_ID="$GITHUB_RUN_ID"
          REPO="$GITHUB_REPOSITORY"
          EVENT="$GITHUB_EVENT_NAME"
          ARTIFACT_DIR="/home/portion/actions-runner/_work/artifacts/${RUN_ID}"

          python3 - <<PY
          import json, os, urllib.request
          log_summary = os.environ.get("LOG_SUMMARY", "")
          body = f"""## Multi-Client Test Failure

          **Mode:** ${MODE}
          **Commit:** ${COMMIT}
          **Trigger:** ${EVENT}

          ### Test Summary
          \`\`\`
          {log_summary}
          \`\`\`

          ### Artifacts
          - [Test results](https://github.com/${REPO}/actions/runs/${RUN_ID})
          - Logs on runner: ${ARTIFACT_DIR}

          ### Action Required
          1. Check logs at ${ARTIFACT_DIR}
          2. Check \`multi-client-output.log\` for failed test cases
          3. Check \`check_dmesg_anomaly\` output for SLUB/kernel anomalies
          4. If SLUB anomaly: investigate use-after-free in the indicated function
          """
          payload = {
              "title": f"[REGRESSION] Multi-client ${MODE} test failed (${COMMIT})",
              "body": body,
              "labels": ["regression", "kernel", "multi-client"]
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/${REPO}/issues",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer ${GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Issue created: {resp.status}")
          except Exception as e:
              print(f"::warning::Failed to create issue: {e}")
          PY

      - name: Cleanup VMs
        if: always()
        run: |
          echo "=== Cleaning up VMs ==="
          sudo pkill -f "qemu.*2223" 2>/dev/null || true
          sudo pkill -f "qemu.*2224" 2>/dev/null || true
          sleep 2
          # Verify cleanup
          pgrep -af qemu | head -5 || echo "All VMs stopped"
