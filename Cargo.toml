[workspace]
members = [
    "powerfs-net",
    "powerfs-master-net",
    "powerfs-lease",
    "powerfs-lock",
    "powerfs-lock-net",
    "powerfs-lock-fuse",
    "powerfs-core",
    "powerfs-master",
    "powerfs-volume",
    "powerfs-fuse",
    "powerfs-fuse-core",
    "powerfs-layout",
    "powerfs-common",
    "powerfs-allocator",
    "powerfs-s3",
    "powerfs-cli",
    "powerfs-kv-client",
    "powerfs-monitor",
    "powerfs-orset",
    "powerfs-filer",
    "powerfs-coherence",
    "powerfs-init",
    "powerfs-raft",
    "rfs_tester",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PowerFS Team <jiangjinhu@fudan.edu.cn>"]
description = "Zero-jitter unified parallel file system for HPC simulation and LLM KV cache"
license = "Apache-2.0"
homepage = "https://www.powerfs.org"
repository = "https://github.com/fudanPPI/powerfs"
readme = "README.md"
keywords = ["storage", "hpc", "filesystem", "distributed", "kv-cache"]
categories = ["filesystem", "concurrency", "network-programming", "database"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
bytes = { version = "1.5" }
thiserror = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
log = { version = "0.4" }
env_logger = { version = "0.10" }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = { version = "0.1" }
futures = { version = "0.3" }
tonic = { version = "0.11" }
prost = { version = "0.12" }
# openraft 0.10 (alpha) — 共识层新实现，参考 examples/raft-kv-memstore-grpc。
# 直接用 crates.io 包（openraft/ 本地克隆仅作参考阅读，已 gitignore，不参与编译）。
# `serde` feature 让 openraft 的 LogId/Vote/Membership 等类型可序列化到 RocksDB。
openraft = { version = "0.10.0-alpha.33", features = ["type-alias", "serde"] }
openraft-multi = "0.10.0-alpha.33"
byteorder = "1.5"
tempfile = "3.10"
fuse-backend-rs = { version = "0.14" }
fuser = { version = "0.16" }
libc = { version = "0.2" }
nix = { version = "0.28", features = ["mount"] }
rand = { version = "0.8" }
blake3 = { version = "1.5" }
crossbeam = { version = "0.8" }
crossbeam-queue = { version = "0.3" }
dashmap = { version = "5" }
lru = { version = "0.12" }
rocksdb = { version = "0.22", features = ["snappy", "zstd", "lz4"], default-features = false }
clap = { version = "4.4", features = ["derive"] }
