[package]
name = "powerfs-monitor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://www.powerfs.org"
repository = "https://github.com/fudanPPI/powerfs"
description = "PowerFS Monitor - metrics, alerting, and web dashboard backend"

[package.metadata.deb]
maintainer = "PowerFS Team <jiangjinhu@fudan.edu.cn>"
section = "net"
priority = "optional"
depends = "powerfs-cli (= 0.1.0)"
conf-files = ["/etc/powerfs/powerfs.env"]
assets = [
    ["target/release/powerfs-monitor", "usr/bin/", "755"],
    ["../powerfs-packaging/systemd/powerfs-monitor.service", "lib/systemd/system/", "644"],
    ["../powerfs-packaging/scripts/postinst", "DEBIAN/postinst", "755"],
    ["../powerfs-packaging/scripts/prerm", "DEBIAN/prerm", "755"],
    ["../powerfs-packaging/scripts/postrm", "DEBIAN/postrm", "755"],
]

[[bin]]
name = "powerfs-monitor"
path = "src/main.rs"

[features]
default = ["redis"]
redis = ["dep:redis", "powerfs-common/redis-event"]

[dependencies]
powerfs-common = { path = "../powerfs-common" }
powerfs-core = { path = "../powerfs-core" }
powerfs-master = { path = "../powerfs-master" }
powerfs-kv-client = { path = "../powerfs-kv-client" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
axum = { version = "0.6", features = ["ws", "json", "multipart"] }
redis = { version = "0.24", features = ["tokio-comp"], optional = true }
tower-http = { version = "0.4", features = ["cors"] }
futures = { workspace = true }
futures-util = { version = "0.3" }
clap = { workspace = true }
env_logger = { workspace = true }
rand = { version = "0.8" }
reqwest = { version = "0.11", features = ["json"] }
regex = { version = "1" }
jsonwebtoken = "9"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
rocksdb = { workspace = true }
tower = { version = "0.4", features = ["util"] }
tonic = { version = "0.11" }
tempfile = "3"