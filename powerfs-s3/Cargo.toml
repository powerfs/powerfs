[package]
name = "powerfs-s3"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://www.powerfs.org"
repository = "https://github.com/fudanPPI/powerfs"
description = "PowerFS S3 gateway - S3-compatible HTTP API"

[package.metadata.deb]
maintainer = "PowerFS Team <jiangjinhu@fudan.edu.cn>"
section = "net"
priority = "optional"
depends = "powerfs-cli (= 0.1.0)"
conf-files = ["/etc/powerfs/powerfs.env"]
assets = [
    ["target/release/powerfs-s3", "usr/bin/", "755"],
    ["../powerfs-packaging/systemd/powerfs-s3.service", "lib/systemd/system/", "644"],
    ["../powerfs-packaging/scripts/postinst", "DEBIAN/postinst", "755"],
    ["../powerfs-packaging/scripts/prerm", "DEBIAN/prerm", "755"],
    ["../powerfs-packaging/scripts/postrm", "DEBIAN/postrm", "755"],
]

[[bin]]
name = "powerfs-s3"
path = "src/main.rs"

[dependencies]
powerfs-common = { path = "../powerfs-common" }
powerfs-master = { path = "../powerfs-master" }
clap = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
