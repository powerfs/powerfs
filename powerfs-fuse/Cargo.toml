[package]
name = "powerfs-fuse"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://www.powerfs.org"
repository = "https://github.com/fudanPPI/powerfs"
description = "PowerFS FUSE client - mounts PowerFS as a POSIX filesystem"

[package.metadata.deb]
maintainer = "PowerFS Team <jiangjinhu@fudan.edu.cn>"
section = "utils"
priority = "optional"
depends = "powerfs-cli (= 0.1.0), fuse3"
conf-files = ["/etc/powerfs/powerfs.env"]
assets = [
    ["target/release/powerfs-fuse", "usr/bin/", "755"],
    ["../powerfs-packaging/systemd/powerfs-fuse.service", "lib/systemd/system/", "644"],
    ["../powerfs-packaging/scripts/postinst", "DEBIAN/postinst", "755"],
    ["../powerfs-packaging/scripts/prerm", "DEBIAN/prerm", "755"],
    ["../powerfs-packaging/scripts/postrm", "DEBIAN/postrm", "755"],
]

[[bin]]
name = "powerfs-fuse"
path = "src/main.rs"

[[bench]]
name = "fs_bench"
path = "benches/fs_bench.rs"
harness = false

[features]
default = []

[dependencies]
powerfs-fuse-core = { path = "../powerfs-fuse-core" }
powerfs-common = { path = "../powerfs-common" }
powerfs-core = { path = "../powerfs-core" }
powerfs-master = { path = "../powerfs-master" }
powerfs-net = { path = "../powerfs-net" }
powerfs-orset = { path = "../powerfs-orset" }
powerfs-coherence = { path = "../powerfs-coherence" }
powerfs-layout = { path = "../powerfs-layout" }
fuse-backend-rs = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
lru = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
num_cpus = "1.16"
uuid = { workspace = true }
futures = { workspace = true }
crc32fast = "1.4"

[dev-dependencies]
rfs_tester = { path = "../rfs_tester" }
